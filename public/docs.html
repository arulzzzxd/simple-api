    <h1 data-lang="doc_title">Dokumentasi Endpoint</h1>
    
    <div style="border: 1px solid var(--border-color); padding: 15px; margin-top: 20px;">
      <h3>GET /api/download/tiktok</h3>
      <p>Download video TikTok tanpa watermark.</p>
      <p><b>Parameter:</b></p>
      <ul>
        <li><code>url</code> (Required): Link video TikTok</li>
        <li><code>apikey</code> (Required): Key API Anda</li>
      </ul>
      <p><b>Contoh Request:</b></p>
      <code>/api/download/tiktok?url=HTTPS_TIKTOK_URL&apikey=YOUR_APIKEY</code>
    </div>
  </div>
