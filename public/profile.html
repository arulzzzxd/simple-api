<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Cyan Neon API - Profile</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="logo">CyanNeon.API</div>
    <nav>
      <a href="/home.html" data-lang="nav_home">Beranda</a>
      <a href="/docs.html" data-lang="nav_docs">Dokumentasi</a>
      <a href="/profile.html" data-lang="nav_profile">Profil</a>
    </nav>
    <div class="controls">
      <button id="theme-toggle">🌗 Theme</button>
      <button id="lang-toggle">🌐 ID/EN</button>
    </div>
  </header>

  <div class="container">
    <h1 data-lang="profile_title">Profil Pengguna & API Key</h1>

    <!-- Form Login jika belum terautentikasi -->
    <div id="auth-section">
      <h3>Login / Register</h3>
      <form id="login-form">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn-cyan">Login</button>
        <button type="button" onclick="register()" class="btn-cyan">Register</button>
      </form>
      <br>
      <a href="/auth/google"><button class="btn-cyan" style="background:#db4437; color:#fff;">Login via Google</button></a>
      <a href="/auth/github"><button class="btn-cyan" style="background:#333; color:#fff;">Login via GitHub</button></a>
    </div>

    <!-- Tampilan Data User -->
    <div id="user-section" style="display: none;">
      <p><b>Username:</b> <span id="u-name"></span></p>
      <p><b>API Key:</b> <code id="u-key" style="color:var(--cyan-neon);"></code></p>
      <p><b>Plan Status:</b> <span id="u-plan" style="text-transform: uppercase;"></span></p>
      <p><b>Sisa Limit:</b> <span id="u-limit"></span></p>

      <h3>Upgrade Plan</h3>
      <button onclick="upgrade('premium')" class="btn-cyan">Upgrade Premium</button>
      <button onclick="upgrade('vip')" class="btn-cyan">Upgrade VIP</button>
      <br><br>
      <a href="/auth/logout"><button style="background:red; color:#fff; border:none; padding:8px 15px; cursor:pointer;">Logout</button></a>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/lang.js"></script>
  <script>
    async function loadUser() {
      const res = await fetch('/api/user/me');
      const data = await res.json();
      if(data.status) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('user-section').style.display = 'block';
        document.getElementById('u-name').innerText = data.user.username;
        document.getElementById('u-key').innerText = data.user.apiKey;
        document.getElementById('u-plan').innerText = data.user.plan;
        document.getElementById('u-limit').innerText = data.user.limit;
      }
    }

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      alert(data.message);
      if(data.status) location.reload();
    };

    async function register() {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      alert(data.message);
      if(data.status) location.reload();
    }

    async function upgrade(plan) {
      const res = await fetch('/api/user/upgrade', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ plan })
      });
      const data = await res.json();
      alert(data.message);
      if(data.status) location.reload();
    }

    loadUser();
  </script>
</body>
</html>
